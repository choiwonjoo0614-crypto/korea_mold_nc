<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>금형가공팀 AI 오피스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">㈜한국몰드</p>
      <h1><span id="team">금형가공팀</span> AI 오피스</h1>
    </div>
    <div class="clock">
      <div id="now-date"></div>
      <div id="now-time" class="time"></div>
      <div class="muted small">데이터 기준 <span id="updated">-</span><span id="source"></span></div>
    </div>
  </header>

  <section class="tower-wrap" aria-label="3D 타워">
    <div id="tower" class="overview"></div>
    <div class="tower-ui">
      <div class="pills">
        <button data-view="전체" class="pill on">전체 타워</button>
        <button data-view="4F" class="pill"><span class="dot" style="background:#f472b6"></span>4F CAM 사무실</button>
        <button data-view="3F" class="pill"><span class="dot" style="background:#a855f7"></span>3F 관리 사무실</button>
        <button data-view="2F" class="pill"><span class="dot" style="background:#22d3ee"></span>2F 가공 B동</button>
        <button data-view="1F" class="pill"><span class="dot" style="background:#3b82f6"></span>1F 가공 A동</button>
        <label class="pill"><input id="auto-rotate" type="checkbox"> 자동 회전</label>
      </div>
      <div id="tower-info" class="tower-info" hidden></div>
    </div>
    <p class="tower-hint">드래그로 회전 · 휠로 확대 · 설비를 누르면 상세 정보</p>
  </section>

  <main>
    <section class="summary card" aria-label="오늘의 요약">
      <h2>오늘의 요약</h2>
      <ul id="summary"></ul>
    </section>

    <section class="kpis" id="kpis" aria-label="설비 현황 숫자"></section>

    <section class="card floor" aria-label="가공동 배치도">
      <div class="card-head">
        <h2>설비 상세</h2>
        <div class="legend">
          <span class="dot s-가동"></span>가동
          <span class="dot s-대기"></span>대기
          <span class="dot s-점검"></span>점검
          <span class="dot s-정지"></span>정지
        </div>
      </div>
      <div id="zones" class="zones"></div>
    </section>

    <div class="side">
      <section class="card" aria-label="오늘 일정">
        <h2>오늘 일정</h2>
        <ol id="schedule" class="schedule"></ol>
      </section>
      <section class="card" aria-label="공지">
        <h2>공지</h2>
        <ul id="notice" class="notice"></ul>
      </section>
    </div>

    <section class="card board" aria-label="작업 보드">
      <div class="card-head">
        <h2>작업 보드</h2>
        <input id="search" type="search" placeholder="금형번호·담당자 검색">
      </div>
      <div class="cols">
        <div><h3>대기 <span id="c-대기" class="count"></span></h3><div id="col-대기" class="list"></div></div>
        <div><h3>진행 <span id="c-진행" class="count"></span></h3><div id="col-진행" class="list"></div></div>
        <div><h3>완료 <span id="c-완료" class="count"></span></h3><div id="col-완료" class="list"></div></div>
      </div>
    </section>
  </main>

  <footer class="muted small">데이터는 Neon 데이터베이스에서 불러옵니다.</footer>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="tower.js"></script>
  <script src="app.js"></script>
</body>
</html>
